<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập Key Của Bạn</title>

<style>
body{
  margin:0;
  background:rgba(0,0,0,0.85);
  font-family:Arial;
  color:#00ffcc;
}

/* menu chính */
#menu{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  z-index:999999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.box{
  background:#111;
  padding:20px;
  width:280px;
  border-radius:12px;
  box-shadow:0 0 15px #00ffcc;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  text-align:center;
  margin-top:10px;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#00ffcc;
  font-weight:bold;
}

a{
  display:block;
  margin-top:12px;
  color:#00ffcc;
  text-decoration:underline;
  font-size:14px;
}

#countdown{
  margin-top:10px;
  font-size:14px;
  color:#fff;
}
</style>
</head>

<body>

<div id="menu">
  <div class="box">
    <h3>🔐 NHẬP KEY</h3>

    <input id="keyInput" placeholder="Nhập key">

    <button onclick="submitKey()">XÁC NHẬN</button>

    <a href="https://link4m.com/Yo0sXR9" target="_blank">
      👉 GET KEY 👈
    </a>

    <div id="countdown"></div>
  </div>
</div>

<script>
/* ===== CẤU HÌNH ===== */
const REAL_KEY = "KEYFREE_DinhAnh";
const KEY_TIME = 24 * 60 * 60 * 1000; // 1 ngày (ms)

/* ===== XỬ LÝ ===== */
function submitKey(){
  let k = document.getElementById("keyInput").value.trim();
  if(k === REAL_KEY){
    let expire = Date.now() + KEY_TIME;
    localStorage.setItem("key_expire", expire);
    startCountdown();
  }else{
    alert("❌ KEY KHÔNG ĐÚNG");
  }
}

function startCountdown(){
  let cd = document.getElementById("countdown");

  setInterval(function(){
    let expire = parseInt(localStorage.getItem("key_expire") || 0);
    let now = Date.now();
    let left = expire - now;

    if(left <= 0){
      cd.innerHTML = "⛔ KEY ĐÃ HẾT HẠN";
      localStorage.removeItem("key_expire");
    }else{
      let h = Math.floor(left / 3600000);
      let m = Math.floor((left % 3600000) / 60000);
      let s = Math.floor((left % 60000) / 1000);
      cd.innerHTML = `⏳ Thời gian còn lại: ${h}h ${m}m ${s}s`;
    }
  }, 1000);
}

/* ===== AUTO CHECK KHI VÀO GAME ===== */
if(localStorage.getItem("key_expire")){
  startCountdown();
}
</script>

</body>
</html>
